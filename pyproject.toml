[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookeanity"
version = "0.0.0"
description = "Illustration of the overdamped fluctuating elastodynamics model."
authors = [
    { name = "Roman Belousov", email = "roman.belousov@embl.de" },
    { name = "Michele Lupini", email = "michele.lupini@embl.de" },
    { name = "Laeschkir Würthner", email = "laeschkir.wuerthner@embl.de" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "numpy", "scipy", "typeguard", "jaxtyping", "h5py", "loguru"
]

[project.optional-dependencies]
tests = ["pytest"]
dev = ["pytest", "pyright", "pydocstringformatter", "ruff"]
doc = ["mkdocs", "mkdocstrings[python]", "mkdocs-material"]
examples = ["matplotlib", "jupyterlab", "ipywidgets", "tqdm", "pyvista[jupyter]"]

[tool.setuptools]
packages = ["hookeanity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pydocstringformatter]
max-line-length = 88
write = true

[tool.ruff]
src = ["hookeanity", "tests", "examples"]
include = ["**/*.py", "**/*.ipynb"]
